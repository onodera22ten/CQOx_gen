# Prometheus Alert Rules for CQOx

groups:
  - name: cqox_api_alerts
    interval: 30s
    rules:
      # API Health
      - alert: APIDown
        expr: up{job="cqox-api"} == 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "CQOx API is down"
          description: "CQOx API instance {{ $labels.instance }} has been down for more than 1 minute"

      # High Error Rate
      - alert: HighErrorRate
        expr: (rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 5%)"

      # SLO: p95 Latency
      - alert: HighLatencyP95
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "P95 latency exceeds 2s"
          description: "95th percentile latency is {{ $value }}s for {{ $labels.endpoint }}"

      # SLO: p99 Latency
      - alert: HighLatencyP99
        expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m])) > 5
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "P99 latency exceeds 5s"
          description: "99th percentile latency is {{ $value }}s for {{ $labels.endpoint }}"

  - name: database_alerts
    interval: 30s
    rules:
      # Database Down
      - alert: DatabaseDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
          team: data
        annotations:
          summary: "PostgreSQL database is down"
          description: "Database {{ $labels.instance }} has been unreachable for 1+ minutes"

      # High Connection Usage
      - alert: HighDatabaseConnections
        expr: (pg_stat_database_numbackends / pg_settings_max_connections) > 0.8
        for: 5m
        labels:
          severity: warning
          team: data
        annotations:
          summary: "Database connection pool near capacity"
          description: "{{ $value | humanizePercentage }} of max connections in use"

      # Slow Queries
      - alert: SlowQueries
        expr: rate(pg_stat_statements_mean_exec_time[5m]) > 1000
        for: 10m
        labels:
          severity: warning
          team: data
        annotations:
          summary: "Slow database queries detected"
          description: "Average query time is {{ $value }}ms"

  - name: celery_alerts
    interval: 30s
    rules:
      # High Task Queue Length
      - alert: HighTaskQueueLength
        expr: celery_queue_length > 1000
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Celery queue backlog building up"
          description: "Queue {{ $labels.queue }} has {{ $value }} pending tasks"

      # Task Failure Rate
      - alert: HighTaskFailureRate
        expr: (rate(celery_task_failed_total[5m]) / rate(celery_task_sent_total[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High Celery task failure rate"
          description: "{{ $value | humanizePercentage }} of tasks are failing"

  - name: resource_alerts
    interval: 30s
    rules:
      # High CPU
      - alert: HighCPU
        expr: (100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)) > 80
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value | humanize }}% on {{ $labels.instance }}"

      # High Memory
      - alert: HighMemory
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes > 0.9
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value | humanizePercentage }} on {{ $labels.instance }}"

      # Disk Space Low
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) < 0.1
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Low disk space"
          description: "Only {{ $value | humanizePercentage }} disk space remaining on {{ $labels.mountpoint }}"

