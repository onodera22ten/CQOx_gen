id: "push_high_uplift_v1"
name: "High-uplift churn-risk segment push 10%OFF"
description: "High uplift & high churn risk customers get 10% coupon via push."
status: "recommended"

dataset_id: "dataset_2025Q1"
target_rule: "uplift >= 0.8 and churn_risk >= 0.6"

offer:
  type: "coupon"
  template_id: "coupon_10pct"
  discount_percentage: 10.0

channels:
  - "push"

frequency_cap: 2
budget_limit: 10000000

objectives:
  - name: "incremental_profit"
    weight: 1.0
  - name: "churn_rate"
    weight: -0.2

risk_constraints:
  min_overlap: 0.6
  min_gamma: 1.3
  max_negative_cate_share: 0.05
  max_risk_cvar_alpha_0_05: -2000000

# Evaluation results (populated after offline evaluation)
incremental_revenue: 3200000.0
incremental_profit: 2500000.0
roi: 3.8
risk_score: 0.12
cas_score: 0.88
