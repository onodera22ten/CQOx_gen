<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CQOx Demo - Causal Query Optimizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background: linear-gradient(135deg, #1B2745 0%, #0F172A 100%);
            color: #E2E8F0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 2px solid #334155;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5em;
            background: linear-gradient(135deg, #3B82F6 0%, #06B6D4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #94A3B8;
            font-size: 0.9em;
        }

        .demo-badge {
            display: inline-block;
            background: #FF5C7A;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8em;
            margin-top: 10px;
        }

        .main-content {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
        }

        .sidebar {
            background: #1E293B;
            padding: 20px;
            border-radius: 10px;
            height: fit-content;
        }

        .results-area {
            background: #1E293B;
            padding: 30px;
            border-radius: 10px;
            min-height: 600px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #94A3B8;
            font-size: 0.9em;
            font-weight: 500;
        }

        select, input {
            width: 100%;
            padding: 10px;
            background: #0F172A;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #E2E8F0;
            font-size: 0.95em;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #3B82F6;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #3B82F6 0%, #2563EB 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: none;
        }

        .estimator-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .estimator-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px;
            background: #0F172A;
            border-radius: 6px;
            cursor: pointer;
        }

        .estimator-checkbox input[type="checkbox"] {
            width: auto;
        }

        .estimator-checkbox label {
            margin: 0;
            cursor: pointer;
            color: #E2E8F0;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .result-card {
            background: #0F172A;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #334155;
        }

        .result-card h3 {
            color: #3B82F6;
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        .metric {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #334155;
        }

        .metric:last-child {
            border-bottom: none;
        }

        .metric-label {
            color: #94A3B8;
            font-size: 0.9em;
        }

        .metric-value {
            color: #E2E8F0;
            font-weight: 600;
        }

        .verdict-card {
            background: linear-gradient(135deg, #10B981 0%, #059669 100%);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 30px;
        }

        .verdict-card.canary {
            background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
        }

        .verdict-card.hold {
            background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
        }

        .verdict-card h2 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .verdict-card .delta-yen {
            font-size: 2.5em;
            font-weight: 700;
        }

        .loading {
            text-align: center;
            padding: 50px;
        }

        .spinner {
            border: 4px solid #334155;
            border-top: 4px solid #3B82F6;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #7F1D1D;
            color: #FCA5A5;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .info-text {
            color: #64748B;
            font-size: 0.85em;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔬 CQOx Demo</h1>
            <p class="subtitle">Causal Query Optimizer - 因果推定プラットフォーム</p>
            <span class="demo-badge">Demo Mode / Sample Data Only</span>
        </header>

        <div class="main-content">
            <div class="sidebar">
                <h2 style="margin-bottom: 20px; color: #3B82F6;">📊 分析設定</h2>

                <div class="form-group">
                    <label for="dataset">データセット</label>
                    <select id="dataset">
                        <option value="">読み込み中...</option>
                    </select>
                    <p class="info-text" id="dataset-info"></p>
                </div>

                <div class="form-group">
                    <label for="treatment">Treatment カラム</label>
                    <select id="treatment">
                        <option value="">データセットを選択してください</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="outcome">Outcome カラム</label>
                    <select id="outcome">
                        <option value="">データセットを選択してください</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>推定量を選択（7つ）</label>
                    <div class="estimator-grid">
                        <div class="estimator-checkbox">
                            <input type="checkbox" id="est-dr" value="DR" checked>
                            <label for="est-dr">Doubly Robust</label>
                        </div>
                        <div class="estimator-checkbox">
                            <input type="checkbox" id="est-ipw" value="IPW" checked>
                            <label for="est-ipw">IPW</label>
                        </div>
                        <div class="estimator-checkbox">
                            <input type="checkbox" id="est-did" value="DiD" checked>
                            <label for="est-did">DiD</label>
                        </div>
                        <div class="estimator-checkbox">
                            <input type="checkbox" id="est-iv" value="IV" checked>
                            <label for="est-iv">IV</label>
                        </div>
                        <div class="estimator-checkbox">
                            <input type="checkbox" id="est-cf" value="CF" checked>
                            <label for="est-cf">Causal Forest</label>
                        </div>
                        <div class="estimator-checkbox">
                            <input type="checkbox" id="est-scm" value="SCM" checked>
                            <label for="est-scm">SCM</label>
                        </div>
                        <div class="estimator-checkbox">
                            <input type="checkbox" id="est-rd" value="RD" checked>
                            <label for="est-rd">RD</label>
                        </div>
                    </div>
                </div>

                <button id="run-btn" onclick="runAnalysis()">🚀 分析実行</button>
            </div>

            <div class="results-area">
                <div id="results-container">
                    <div style="text-align: center; padding: 100px 0; color: #64748B;">
                        <h2>👈 左側で設定を選択し、「分析実行」をクリックしてください</h2>
                        <p style="margin-top: 20px;">サンプルデータを使って7つの因果推定手法を体験できます</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';
        let datasets = [];

        // 初期化
        async function init() {
            try {
                const response = await fetch(`${API_URL}/api/demo/datasets`);
                const data = await response.json();
                datasets = data.datasets;

                const datasetSelect = document.getElementById('dataset');
                datasetSelect.innerHTML = '<option value="">データセットを選択</option>';
                datasets.forEach(ds => {
                    const option = document.createElement('option');
                    option.value = ds.name;
                    option.textContent = `${ds.name} (${ds.rows} rows)`;
                    datasetSelect.appendChild(option);
                });
            } catch (error) {
                console.error('Failed to load datasets:', error);
                document.getElementById('dataset').innerHTML = '<option value="">エラー: サーバに接続できません</option>';
            }
        }

        // データセット変更時
        document.getElementById('dataset').addEventListener('change', function() {
            const selectedDataset = datasets.find(ds => ds.name === this.value);
            if (selectedDataset) {
                const treatmentSelect = document.getElementById('treatment');
                const outcomeSelect = document.getElementById('outcome');

                // カラム選択肢を更新
                treatmentSelect.innerHTML = selectedDataset.columns.map(col =>
                    `<option value="${col}">${col}</option>`
                ).join('');

                outcomeSelect.innerHTML = selectedDataset.columns.map(col =>
                    `<option value="${col}">${col}</option>`
                ).join('');

                // 情報表示
                document.getElementById('dataset-info').textContent =
                    `${selectedDataset.rows}行 × ${selectedDataset.columns.length}列`;
            }
        });

        // 分析実行
        async function runAnalysis() {
            const dataset = document.getElementById('dataset').value;
            const treatment = document.getElementById('treatment').value;
            const outcome = document.getElementById('outcome').value;

            if (!dataset || !treatment || !outcome) {
                alert('データセット、Treatment、Outcomeを選択してください');
                return;
            }

            // 選択された推定量を取得
            const estimators = [];
            document.querySelectorAll('.estimator-checkbox input:checked').forEach(cb => {
                estimators.push(cb.value);
            });

            if (estimators.length === 0) {
                alert('少なくとも1つの推定量を選択してください');
                return;
            }

            // ローディング表示
            const runBtn = document.getElementById('run-btn');
            runBtn.disabled = true;
            runBtn.textContent = '分析中...';

            const resultsContainer = document.getElementById('results-container');
            resultsContainer.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>因果推定を実行中... (${estimators.length}個の推定量)</p>
                </div>
            `;

            try {
                // 分析リクエスト
                const response = await fetch(`${API_URL}/api/demo/analyze`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        dataset_name: dataset,
                        treatment_col: treatment,
                        outcome_col: outcome,
                        feature_cols: [],
                        estimators: estimators
                    })
                });

                const analysisResult = await response.json();

                if (analysisResult.status === 'failed') {
                    throw new Error(analysisResult.message);
                }

                // 結果取得
                const resultResponse = await fetch(`${API_URL}/api/demo/results/${analysisResult.job_id}`);
                const result = await resultResponse.json();

                // 結果表示
                displayResults(result);

            } catch (error) {
                resultsContainer.innerHTML = `
                    <div class="error">
                        <h3>エラーが発生しました</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            } finally {
                runBtn.disabled = false;
                runBtn.textContent = '🚀 分析実行';
            }
        }

        // 結果表示
        function displayResults(result) {
            const summary = result.results.summary;
            const verdictClass = summary.verdict.toLowerCase();

            let html = `
                <div class="verdict-card ${verdictClass}">
                    <h2>判定: ${summary.verdict}</h2>
                    <div class="delta-yen">Δ¥${(summary.delta_yen / 1000000).toFixed(2)}M</div>
                    <p>平均ATE: ${summary.avg_ate.toFixed(4)} [${summary.avg_ci_low.toFixed(4)}, ${summary.avg_ci_high.toFixed(4)}]</p>
                    <p>CAS Score: ${summary.cas_score.toFixed(2)} | Risk Score: ${summary.risk_score.toFixed(2)}</p>
                </div>

                <h2 style="margin-bottom: 20px; color: #3B82F6;">推定量別の結果</h2>
                <div class="results-grid">
            `;

            Object.entries(result.results.results).forEach(([name, res]) => {
                html += `
                    <div class="result-card">
                        <h3>${res.estimator}</h3>
                        <div class="metric">
                            <span class="metric-label">ATE</span>
                            <span class="metric-value">${res.ate.toFixed(4)}</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">95% CI</span>
                            <span class="metric-value">[${res.ci_low.toFixed(4)}, ${res.ci_high.toFixed(4)}]</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Treated群</span>
                            <span class="metric-value">${res.n_treated}人</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Control群</span>
                            <span class="metric-value">${res.n_control}人</span>
                        </div>
                    </div>
                `;
            });

            html += '</div>';

            document.getElementById('results-container').innerHTML = html;
        }

        // ページ読み込み時
        init();
    </script>
</body>
</html>
