services:
  postgres:
    image: postgres:15-alpine
    container_name: cqox_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cqox}
      POSTGRES_USER: ${POSTGRES_USER:-cqox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cqox_password_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - cqox_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cqox"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cqox_redis
    ports:
      - "6379:6379"
    networks:
      - cqox_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: cqox_backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://cqox:cqox_password_change_me@postgres:5432/cqox}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-me}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@cqox.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin_password_change_me}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - artifacts:/app/artifacts
    networks:
      - cqox_network

  frontend:
    build: ./frontend
    container_name: cqox_frontend
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - cqox_network
    environment:
      - VITE_API_URL=http://localhost:8000

volumes:
  postgres_data:
  artifacts:

networks:
  cqox_network:
    driver: bridge
