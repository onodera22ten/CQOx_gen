# CQOx Production Docker Compose Configuration
# 本番環境用の完全な構成

services:
  # PostgreSQL Database
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: cqox-postgres
    environment:
      POSTGRES_USER: cqox
      POSTGRES_PASSWORD: cqox_dev_password
      POSTGRES_DB: cqox_dev
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cqox"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: cqox-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: cqox-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: cqox
      RABBITMQ_DEFAULT_PASS: cqox_dev_password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # FastAPI Backend
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cqox-api
    environment:
      DATABASE_URL: postgresql+asyncpg://cqox:cqox_dev_password@postgres:5432/cqox_dev
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://cqox:cqox_dev_password@rabbitmq:5672//
      PYTHONPATH: /app
      SKIP_AUTH: "false"
      SECRET_KEY: your-secret-key-here
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./data/uploads:/app/data/uploads
      - ./twin.pdf:/app/twin.pdf:ro
      - api_logs:/app/logs
    command: uvicorn cqox.api.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Celery Worker (非同期タスク処理)
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cqox-celery-worker
    environment:
      DATABASE_URL: postgresql+asyncpg://cqox:cqox_dev_password@postgres:5432/cqox_dev
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://cqox:cqox_dev_password@rabbitmq:5672//
      PYTHONPATH: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./data/uploads:/app/data/uploads
    command: celery -A cqox.tasks.celery_app worker --loglevel=info --concurrency=2

  # Frontend (React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "http://localhost:8000"
        VITE_USE_MOCK: "false"
    container_name: cqox-frontend
    ports:
      - "3004:80"
    depends_on:
      - api
    environment:
      NODE_ENV: production

  prometheus:
    image: prom/prometheus:latest
    container_name: cqox-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

  grafana:
    image: grafana/grafana:10.4.2
    container_name: cqox-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  api_logs:
  rabbitmq_data:
