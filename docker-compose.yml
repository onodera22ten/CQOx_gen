# Docker Compose for CQOx Local Development
# Run: docker-compose up -d

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: cqox-postgres
    environment:
      POSTGRES_USER: cqox
      POSTGRES_PASSWORD: cqox_dev_password
      POSTGRES_DB: cqox_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cqox"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: cqox-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: cqox-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: cqox
      RABBITMQ_DEFAULT_PASS: cqox_dev_password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # API
  api:
    build: ./backend
    container_name: cqox-api
    environment:
      DATABASE_URL: postgresql://cqox:cqox_dev_password@postgres:5432/cqox_dev
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://cqox:cqox_dev_password@rabbitmq:5672//
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - rabbitmq

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
