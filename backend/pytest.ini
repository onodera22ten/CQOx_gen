[pytest]
# Pytest configuration for CQOx

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories
testpaths = tests
norecursedirs = .git .tox dist build *.egg venv

# Output
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=cqox
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --durations=10

# Markers
markers =
    unit: Unit tests for individual components
    integration: Integration tests for API endpoints
    slow: Slow-running tests (e.g., large-scale simulations)
    requires_redis: Tests that require Redis connection
    requires_db: Tests that require database connection
    requires_rabbitmq: Tests that require RabbitMQ connection

# Coverage
[coverage:run]
source = cqox
omit =
    */tests/*
    */venv/*
    */migrations/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
