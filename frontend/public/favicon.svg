<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#gradient1)"/>

  <!-- Causal Graph Icon -->
  <g id="causal-graph">
    <!-- Node A -->
    <circle cx="180" cy="200" r="30" fill="#3B82F6" stroke="#E2E8F0" stroke-width="4"/>
    <text x="180" y="210" text-anchor="middle" fill="white" font-size="24" font-weight="bold" font-family="Inter">T</text>

    <!-- Node B -->
    <circle cx="332" cy="200" r="30" fill="#06B6D4" stroke="#E2E8F0" stroke-width="4"/>
    <text x="332" y="210" text-anchor="middle" fill="white" font-size="24" font-weight="bold" font-family="Inter">Y</text>

    <!-- Node C (Confounder) -->
    <circle cx="256" cy="120" r="25" fill="#FF5C7A" stroke="#E2E8F0" stroke-width="4"/>
    <text x="256" y="128" text-anchor="middle" fill="white" font-size="20" font-weight="bold" font-family="Inter">X</text>

    <!-- Arrows -->
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
        <polygon points="0 0, 10 3, 0 6" fill="#E2E8F0"/>
      </marker>
    </defs>

    <!-- T -> Y -->
    <path d="M 210 200 L 302 200" stroke="#E2E8F0" stroke-width="6" marker-end="url(#arrowhead)"/>

    <!-- X -> T -->
    <path d="M 240 135 L 195 185" stroke="#E2E8F0" stroke-width="4" marker-end="url(#arrowhead)"/>

    <!-- X -> Y -->
    <path d="M 272 135 L 317 185" stroke="#E2E8F0" stroke-width="4" marker-end="url(#arrowhead)"/>
  </g>

  <!-- CQOx Text -->
  <text x="256" y="330" text-anchor="middle" fill="white" font-size="72" font-weight="900" font-family="Inter">CQOx</text>
  <text x="256" y="370" text-anchor="middle" fill="#94A3B8" font-size="24" font-weight="500" font-family="Inter">Causal Query Optimizer</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B2745;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
