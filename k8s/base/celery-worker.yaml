---
# Celery Worker Deployment (Realtime Queue)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker-realtime
  namespace: cqox-production
  labels:
    app: celery-worker
    queue: realtime
spec:
  replicas: 10
  selector:
    matchLabels:
      app: celery-worker
      queue: realtime
  template:
    metadata:
      labels:
        app: celery-worker
        queue: realtime
    spec:
      serviceAccountName: celery-worker

      containers:
        - name: worker
          image: cqox-api:latest
          command:
            - celery
            - -A
            - cqox.core.distributed_jobs
            - worker
            - --loglevel=info
            - --queues=realtime
            - --concurrency=10
            - --max-tasks-per-child=1000
          env:
            - name: CELERY_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: cqox-secrets
                  key: celery-broker-url
            - name: CELERY_RESULT_BACKEND
              valueFrom:
                secretKeyRef:
                  name: cqox-secrets
                  key: celery-result-backend

          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"

---
# Horizontal Pod Autoscaler for Heavy Workers
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: celery-worker-heavy-hpa
  namespace: cqox-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: celery-worker-heavy
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
