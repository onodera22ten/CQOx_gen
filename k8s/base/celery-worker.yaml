  replicas: 5
  selector:
    matchLabels:
      app: celery-worker
      queue: light
  template:
    metadata:
      labels:
        app: celery-worker
        queue: light
    spec:
      serviceAccountName: celery-worker

      containers:
        - name: worker
          image: cqox-api:latest
          command:
            - celery
            - -A
            - cqox.core.distributed_jobs
            - worker
            - --loglevel=info
            - --queues=light
            - --concurrency=4
            - --max-tasks-per-child=500
          env:
            - name: CELERY_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: cqox-secrets
                  key: celery-broker-url
            - name: CELERY_RESULT_BACKEND
              valueFrom:
                secretKeyRef:
                  name: cqox-secrets
