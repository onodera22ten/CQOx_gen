---
# Celery Worker Deployment (Heavy Queue)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker-heavy
  namespace: cqox-production
  labels:
    app: celery-worker
    queue: heavy
spec:
  replicas: 3
  selector:
    matchLabels:
      app: celery-worker
      queue: heavy
  template:
    metadata:
      labels:
        app: celery-worker
        queue: heavy
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: celery-worker

      containers:
        - name: worker
          image: cqox-api:latest
          command:
            - celery
            - -A
            - cqox.core.distributed_jobs
            - worker
            - --loglevel=info
            - --queues=heavy
            - --concurrency=2
            - --max-tasks-per-child=100
          env:
            - name: CELERY_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: cqox-secrets
                  key: celery-broker-url
            - name: CELERY_RESULT_BACKEND
              valueFrom:
                secretKeyRef:
                  name: cqox-secrets
                  key: celery-result-backend
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cqox-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: cqox-secrets
                  key: redis-url

          resources:
            requests:
              memory: "1Gi"
              cpu: "1000m"
            limits:
              memory: "4Gi"
              cpu: "2000m"

          livenessProbe:
            exec:
              command:
                - celery
                - -A
                - cqox.core.distributed_jobs
                - inspect
                - ping
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10

---
# Celery Worker Deployment (Light Queue)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker-light
  namespace: cqox-production
  labels:
    app: celery-worker
    queue: light
